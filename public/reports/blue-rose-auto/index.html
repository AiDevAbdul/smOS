<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blue Rose Auto Care &amp; Repair Services — Engagement Hub</title>
<meta name="description" content="Blue Rose Auto Care &amp; Repair Services — engagement hub by Ducker Creative">
<meta property="og:title" content="Blue Rose Auto Care &amp; Repair Services — Engagement Hub">
<meta property="og:description" content="Your full engagement with Ducker Creative, in one place.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%230a84ff%22%2F%3E%3Cstop%20offset%3D%220.52%22%20stop-color%3D%22%235e5ce6%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%237d3cff%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%230b0b10%22%2F%3E%3Crect%20x%3D%226.5%22%20y%3D%226.5%22%20width%3D%2219%22%20height%3D%2219%22%20rx%3D%225%22%20fill%3D%22url(%23g)%22%2F%3E%3C%2Fsvg%3E">
<style>/* ============================================================================
   smOS Design System — "Cupertino"
   Single source of truth for every client-facing report & template.
   Apple / iOS visual language: SF Pro system type, #f5f5f7 canvas, #1d1d1f ink,
   system semantic colors, soft elevation, generous radii, 8pt rhythm.

   DO NOT fork this per report. Renderers read this file at render time via
   scripts/lib/design_system.js (Node) and scripts/lib/design_system.py (Python)
   and inline it. Edit here once; every deliverable inherits it.
   ============================================================================ */

:root {
  color-scheme: light;

  /* ---- Surfaces (Apple light-gray system) ---- */
  --ds-bg:        #f5f5f7;   /* page canvas */
  --ds-surface:   #ffffff;   /* cards, tables, sheets */
  --ds-surface-2: #fbfbfd;   /* zebra rows, subtle fills */
  --ds-glass:     rgba(255,255,255,.72);

  /* ---- Ink / text ---- */
  --ds-ink:    #1d1d1f;      /* primary text */
  --ds-ink-2:  #3a3a3c;      /* strong secondary */
  --ds-muted:  #6e6e73;      /* secondary / captions (Apple gray) */
  --ds-faint:  #8e8e93;      /* tertiary / footnotes */

  /* ---- Lines ---- */
  --ds-line:        #e2e2e7;
  --ds-line-strong: #d2d2d7;

  /* ---- Brand + iOS system semantic colors ---- */
  --ds-blue:        #0071e3;  /* primary action (Apple keynote blue) */
  --ds-blue-strong: #0066cc;
  --ds-indigo:      #5e5ce6;
  --ds-green:       #34c759;  /* systemGreen — success / scale */
  --ds-amber:       #ff9f0a;  /* systemOrange — at risk / warn */
  --ds-red:         #ff3b30;  /* systemRed — critical / pause */
  --ds-purple:      #af52de;  /* systemPurple */
  --ds-teal:        #5ac8fa;  /* systemTeal */
  --ds-pink:        #ff375f;  /* systemPink */

  /* ---- Soft tints for callouts / pills (light) ---- */
  --ds-blue-tint:  #eef5ff;
  --ds-green-tint: #e7f9ed;
  --ds-amber-tint: #fff5e6;
  --ds-red-tint:   #ffece9;
  --ds-ink-tint:   #f2f2f7;

  /* ---- Type ---- */
  --ds-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
             "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ds-font-mono: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* ---- Radius ---- */
  --ds-r-sm: 10px;
  --ds-r:    14px;
  --ds-r-lg: 20px;
  --ds-r-xl: 28px;
  --ds-r-pill: 980px;

  /* ---- Elevation (low-contrast, Apple-soft) ---- */
  --ds-shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
  --ds-shadow:    0 1px 3px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06);
  --ds-shadow-lg: 0 4px 16px rgba(0,0,0,.08), 0 20px 48px rgba(0,0,0,.10);

  /* ---- Gradients ---- */
  --ds-grad-blue: linear-gradient(135deg, #0a84ff 0%, #0066cc 100%);
  --ds-grad-ink:  linear-gradient(135deg, #2c2c2e 0%, #1d1d1f 100%);
  /* Signature aurora — blue → indigo → violet. Used ONLY on the progress spine,
     active states, and hero accent. The one place boldness is spent. */
  --ds-grad-brand: linear-gradient(135deg, #0a84ff 0%, #5e5ce6 52%, #7d3cff 100%);

  /* ---- "Operating system" shell (dark hub chrome that frames light reports) ---- */
  --ds-shell:     #0b0b10;   /* console canvas (cool near-black) */
  --ds-shell-2:   #16161d;   /* raised shell surface: bars, chips */
  --ds-shell-3:   #20212a;   /* chip hover / hairline fills */
  --ds-shell-ink: #f5f5f7;   /* primary text on shell */
  --ds-shell-mut: #a1a1ab;   /* secondary text on shell */
  --ds-shell-line:#2a2b35;   /* borders on shell */

  /* ---- Display type scale ---- */
  --ds-fs-display: clamp(30px, 4.2vw, 46px);

  /* ---- Motion ---- */
  --ds-ease:       cubic-bezier(.4, 0, .2, 1);
  --ds-ease-out:   cubic-bezier(.16, 1, .3, 1);  /* expressive ease-out for entrances */
  --ds-dur:        220ms;
  --ds-dur-fast:   140ms;
}

/* ---------------------------------------------------------------- Base ---- */
* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  font-family: var(--ds-font);
  font-size: 16px;
  line-height: 1.55;
  color: var(--ds-ink);
  background: var(--ds-bg);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

h1, h2, h3, h4, h5, h6 {
  color: var(--ds-ink);
  line-height: 1.2;
  letter-spacing: -0.01em;
  margin: 0 0 .5em;
  font-weight: 600;
}
h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.022em; }
h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.018em; }
h3 { font-size: 19px; }
h4 { font-size: 16px; }

p  { margin: .65em 0; }
a  { color: var(--ds-blue-strong); text-decoration: none; }
a:hover { text-decoration: underline; }

small, .ds-caption { color: var(--ds-muted); font-size: 13px; }

code, kbd, samp {
  font-family: var(--ds-font-mono);
  font-size: 88%;
  background: var(--ds-ink-tint);
  border-radius: 5px;
  padding: 1px 6px;
}

hr {
  border: 0;
  border-top: 1px solid var(--ds-line);
  margin: 32px 0;
}

ul, ol { margin: .6em 0 .6em 2px; padding-left: 22px; }
li { margin: 4px 0; }

/* Tabular numerals everywhere numbers live — prevents column jitter */
.ds-num, td, th, .ds-kpi__value, .ds-metric { font-variant-numeric: tabular-nums; }

/* ------------------------------------------------------------- Layout ---- */
.ds-wrap {
  max-width: 960px;
  margin: 0 auto;
  padding: 40px 24px 72px;
}
.ds-wrap--wide { max-width: 1200px; }

.ds-section { margin: 36px 0; }

/* -------------------------------------------------------------- Hero ------ */
.ds-hero {
  background: var(--ds-grad-brand);
  color: #fff;
  border-radius: var(--ds-r-lg);
  padding: 44px 40px;
  margin-bottom: 28px;
  box-shadow: 0 12px 32px rgba(94,92,230,.28);
}
.ds-hero h1 { color: #fff; margin: 0; font-size: var(--ds-fs-display); letter-spacing: -0.026em; }
.ds-hero .ds-eyebrow { color: rgba(255,255,255,.82); }
.ds-hero .ds-meta { margin-top: 10px; font-size: 14px; color: rgba(255,255,255,.82); }

.ds-eyebrow {
  text-transform: uppercase;
  letter-spacing: .08em;
  font-size: 12px;
  font-weight: 600;
  color: var(--ds-muted);
  margin-bottom: 6px;
}

/* -------------------------------------------------------------- Card ------ */
.ds-card {
  background: var(--ds-surface);
  border: 1px solid var(--ds-line);
  border-radius: var(--ds-r);
  padding: 22px 24px;
  box-shadow: var(--ds-shadow-sm);
}
.ds-card + .ds-card { margin-top: 16px; }

/* --------------------------------------------------------- KPI cards ------ */
.ds-kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin: 20px 0;
}
.ds-kpi {
  background: var(--ds-surface);
  border: 1px solid var(--ds-line);
  border-radius: var(--ds-r);
  padding: 18px 20px;
  box-shadow: var(--ds-shadow-sm);
}
.ds-kpi__label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  color: var(--ds-muted);
}
.ds-kpi__value {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 6px 0 2px;
}
.ds-kpi__delta { font-size: 13px; font-weight: 500; }
.ds-kpi__delta--up   { color: var(--ds-green); }
.ds-kpi__delta--down { color: var(--ds-red); }

/* --------------------------------------------------------- Badges --------- */
.ds-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 11px;
  border-radius: var(--ds-r-pill);
  line-height: 1.3;
}
.ds-badge--good { background: var(--ds-green-tint); color: #1c7a3e; }
.ds-badge--warn { background: var(--ds-amber-tint); color: #9a5b00; }
.ds-badge--bad  { background: var(--ds-red-tint);   color: #b3261e; }
.ds-badge--info { background: var(--ds-blue-tint);  color: var(--ds-blue-strong); }
.ds-badge--neutral { background: var(--ds-ink-tint); color: var(--ds-ink-2); }

/* --------------------------------------------------------- Callouts ------- */
.ds-callout {
  border-radius: var(--ds-r);
  padding: 16px 18px;
  margin: 18px 0;
  border-left: 4px solid var(--ds-blue);
  background: var(--ds-blue-tint);
}
.ds-callout--good { border-left-color: var(--ds-green); background: var(--ds-green-tint); }
.ds-callout--warn { border-left-color: var(--ds-amber); background: var(--ds-amber-tint); }
.ds-callout--bad  { border-left-color: var(--ds-red);   background: var(--ds-red-tint); }

/* ---------------------------------------------------------- Tables -------- */
.ds-table-wrap {
  overflow-x: auto;
  margin: 18px 0;
  border-radius: var(--ds-r);
  background: var(--ds-surface);
  border: 1px solid var(--ds-line);
  box-shadow: var(--ds-shadow-sm);
}
table.ds-table, .ds-table-wrap table {
  border-collapse: collapse;
  width: 100%;
  font-size: 14px;
}
.ds-table-wrap thead th, table.ds-table thead th {
  background: var(--ds-grad-ink);
  color: #fff;
  text-align: left;
  padding: 12px 16px;
  font-weight: 600;
  letter-spacing: .01em;
}
.ds-table-wrap tbody td, table.ds-table tbody td {
  padding: 11px 16px;
  border-top: 1px solid var(--ds-line);
}
.ds-table-wrap tbody tr:nth-child(even),
table.ds-table tbody tr:nth-child(even) { background: var(--ds-surface-2); }

/* ---------------------------------------------------------- Charts -------- */
/* Canvas wrapper so Chart.js / SVG charts inherit card styling consistently */
.ds-chart {
  background: var(--ds-surface);
  border: 1px solid var(--ds-line);
  border-radius: var(--ds-r);
  padding: 20px;
  box-shadow: var(--ds-shadow-sm);
  margin: 18px 0;
}
.ds-chart__title { font-size: 15px; font-weight: 600; margin-bottom: 14px; }

/* --------------------------------------------------------- Buttons -------- */
.ds-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-family: var(--ds-font);
  font-size: 14px;
  font-weight: 600;
  line-height: 1;
  padding: 11px 18px;
  border-radius: var(--ds-r-pill);
  border: 1px solid transparent;
  background: var(--ds-blue);
  color: #fff;
  cursor: pointer;
  text-decoration: none;
  transition: background var(--ds-dur) var(--ds-ease), transform var(--ds-dur) var(--ds-ease);
}
.ds-btn:hover { background: var(--ds-blue-strong); text-decoration: none; }
.ds-btn:active { transform: translateY(1px); }
.ds-btn--ghost {
  background: var(--ds-surface);
  color: var(--ds-blue-strong);
  border-color: var(--ds-line-strong);
}
.ds-btn--ghost:hover { background: var(--ds-ink-tint); }
.ds-btn[aria-disabled="true"] {
  background: transparent;
  border: 1px dashed var(--ds-line-strong);
  color: var(--ds-muted);
  font-weight: 500;
  cursor: default;
  pointer-events: none;
}

/* -------------------------------------------------------- Roadmap --------- */
/* Vertical journey of numbered steps. Each step = a bold circular badge + a
   card holding a title, description, and one or more action buttons. Used by
   /bundle to assemble a client's whole engagement into one shareable hub. */
.ds-roadmap { margin: 28px 0; }
.ds-step {
  position: relative;
  display: grid;
  grid-template-columns: 48px 1fr;
  gap: 18px;
  padding-bottom: 24px;
}
/* connector spine — aurora gradient on delivered steps, grey on pending */
.ds-step:not(:last-child)::before {
  content: "";
  position: absolute;
  left: 23px;
  top: 48px;
  bottom: -4px;
  width: 2px;
  background-image: var(--ds-grad-brand);
}
.ds-step.is-pending:not(:last-child)::before { background: var(--ds-line-strong); }
.ds-step-num {
  position: relative;
  z-index: 1;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background-image: var(--ds-grad-brand);
  color: #fff;
  font-weight: 700;
  font-size: 19px;
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(94,92,230,.32);
}
.ds-step.is-pending .ds-step-num {
  background: var(--ds-surface);
  color: var(--ds-faint);
  border: 2px dashed var(--ds-line-strong);
  box-shadow: none;
}
.ds-step-body {
  background: var(--ds-surface);
  border: 1px solid var(--ds-line);
  border-radius: var(--ds-r);
  padding: 18px 20px;
  box-shadow: var(--ds-shadow-sm);
  transition: transform var(--ds-dur) var(--ds-ease), box-shadow var(--ds-dur) var(--ds-ease);
}
.ds-step:not(.is-pending) .ds-step-body:hover { transform: translateY(-2px); box-shadow: var(--ds-shadow); }
.ds-step.is-pending .ds-step-title { color: var(--ds-muted); }
.ds-step.is-pending .ds-step-body {
  background: var(--ds-surface-2);
  border-style: dashed;
  box-shadow: none;
}
.ds-step-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
  margin: 0 0 4px;
}
.ds-step-desc { color: var(--ds-muted); font-size: 14px; margin: 0 0 14px; }
.ds-step-actions { display: flex; flex-wrap: wrap; gap: 10px; }

@media (max-width: 640px) {
  .ds-step { grid-template-columns: 40px 1fr; gap: 14px; }
  .ds-step-num { width: 40px; height: 40px; font-size: 16px; }
  .ds-step:not(:last-child)::before { left: 19px; top: 40px; }
}

/* -------------------------------------------------- Hub (OS console) ------ */
/* The /bundle deliverables hub is a single-tab "operating system" console: a
   dark graphite shell (sticky top bar + chip menu + gradient progress spine)
   frames each report as a bright, elevated "window" (the iframe). Dark chrome
   around a light document = intentional app framing (no double-hero). */
.ds-hub {
  min-height: 100dvh; display: flex; flex-direction: column;
  background: var(--ds-shell); color: var(--ds-shell-ink);
}
.ds-skip {
  position: absolute; left: 12px; top: -48px; z-index: 100;
  background: var(--ds-shell-2); color: var(--ds-shell-ink);
  padding: 10px 16px; border-radius: var(--ds-r-sm); border: 1px solid var(--ds-shell-line);
  transition: top var(--ds-dur-fast) var(--ds-ease);
}
.ds-skip:focus { top: 12px; text-decoration: none; }

/* Header = the hero. Client name + agency + a live progress meter. */
.ds-hub__head {
  padding: 22px 24px 16px; display: flex; flex-wrap: wrap;
  align-items: flex-end; justify-content: space-between; gap: 16px 24px;
  border-bottom: 1px solid var(--ds-shell-line);
}
.ds-hub__id { min-width: 0; }
.ds-hub__eyebrow {
  font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ds-shell-mut); margin-bottom: 8px;
}
.ds-hub__title {
  font-size: var(--ds-fs-display); font-weight: 700; letter-spacing: -0.028em;
  line-height: 1.02; margin: 0; color: #fff;
  background: linear-gradient(180deg, #ffffff 60%, #c9c9d6); -webkit-background-clip: text; background-clip: text;
}
.ds-hub__sub { color: var(--ds-shell-mut); font-size: 13.5px; margin-top: 8px; }

/* Progress meter — segmented bar with the aurora gradient on delivered phases. */
.ds-progress { min-width: 220px; flex: 0 1 320px; }
.ds-progress__label {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 12px; color: var(--ds-shell-mut); margin-bottom: 8px;
}
.ds-progress__count { font-variant-numeric: tabular-nums; color: var(--ds-shell-ink); font-weight: 600; }
.ds-progress__track { display: flex; gap: 5px; }
.ds-progress__seg {
  height: 6px; flex: 1; border-radius: var(--ds-r-pill); background: var(--ds-shell-3);
}
.ds-progress__seg.is-done { background-image: var(--ds-grad-brand); }

/* Chip menu (top + bottom) */
.ds-hubnav {
  display: flex; gap: 8px; align-items: center;
  padding: 12px 24px; background: rgba(11,11,16,.72);
  backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--ds-shell-line);
  position: sticky; top: 0; z-index: 10; overflow-x: auto; scrollbar-width: none;
}
.ds-hubnav::-webkit-scrollbar { display: none; }
.ds-hubnav--bottom { border-bottom: 0; border-top: 1px solid var(--ds-shell-line); position: static; }
.ds-hubnav__btn {
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; flex: none;
  font-family: var(--ds-font); font-size: 13px; font-weight: 600; line-height: 1;
  padding: 9px 15px 9px 9px; border-radius: var(--ds-r-pill);
  background: var(--ds-shell-2); color: var(--ds-shell-ink);
  border: 1px solid var(--ds-shell-line); cursor: pointer;
  transition: background var(--ds-dur-fast) var(--ds-ease), border-color var(--ds-dur-fast) var(--ds-ease),
              transform var(--ds-dur-fast) var(--ds-ease);
}
.ds-hubnav__btn .n {
  display: inline-flex; align-items: center; justify-content: center;
  width: 21px; height: 21px; border-radius: 50%;
  background: var(--ds-shell-3); color: var(--ds-shell-ink);
  font-size: 11px; font-weight: 700; font-variant-numeric: tabular-nums; flex: none;
}
.ds-hubnav__btn:hover { background: var(--ds-shell-3); transform: translateY(-1px); }
.ds-hubnav__btn.is-active { border-color: transparent; background-image: var(--ds-grad-brand); color: #fff; }
.ds-hubnav__btn.is-active .n { background: rgba(255,255,255,.25); color: #fff; }
.ds-hubnav__btn.is-disabled { opacity: .4; cursor: default; }
.ds-hubnav__btn.is-disabled:hover { transform: none; background: var(--ds-shell-2); }

/* Viewer = a bright elevated "window" floating in the dark shell. */
.ds-viewer-wrap {
  flex: 1 1 auto; position: relative; margin: 18px; border-radius: var(--ds-r-lg);
  overflow: hidden; background: var(--ds-bg);
  box-shadow: 0 0 0 1px var(--ds-shell-line), 0 24px 60px rgba(0,0,0,.5);
}
.ds-viewer { display: block; width: 100%; height: 100%; min-height: 70vh; border: 0; background: var(--ds-bg); }
.ds-viewer__loader {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: var(--ds-bg); opacity: 0; visibility: hidden;
  transition: opacity var(--ds-dur) var(--ds-ease), visibility var(--ds-dur) var(--ds-ease);
}
.ds-viewer__loader.is-on { opacity: 1; visibility: visible; }
.ds-spinner {
  width: 30px; height: 30px; border-radius: 50%;
  border: 3px solid var(--ds-line); border-top-color: var(--ds-blue);
  animation: ds-spin .8s linear infinite;
}
@keyframes ds-spin { to { transform: rotate(360deg); } }

/* Entrance: chips + spine stagger in on load */
@keyframes ds-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.ds-anim { animation: ds-rise .5s var(--ds-ease-out) both; }

@media (max-width: 760px) {
  .ds-hubnav--bottom { display: none; }              /* one sticky strip is enough on phones */
  .ds-viewer-wrap { margin: 12px; border-radius: var(--ds-r); }
  .ds-hub__head { padding: 18px 16px 14px; }
  .ds-progress { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .ds-anim, .ds-spinner { animation: none; }
  .ds-hubnav__btn:hover { transform: none; }
}

/* --------------------------------------------------------- Footer --------- */

/* --------------------------------------------------------- Footer --------- */
.ds-footer {
  margin-top: 48px;
  padding-top: 20px;
  border-top: 1px solid var(--ds-line);
  color: var(--ds-faint);
  font-size: 12px;
  text-align: center;
}

/* --------------------------------------------------------- A11y ----------- */
:focus-visible { outline: 2px solid var(--ds-blue); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* --------------------------------------------------------- Print ---------- */
@page { size: Letter; margin: 14mm; }
@media print {
  body { background: #fff; }

<script>
  (function () {
    var viewer = document.getElementById("viewer");
    var loader = document.getElementById("loader");
    var main = document.getElementById("viewer-main");
    viewer.addEventListener("load", function () { loader.classList.remove("is-on"); });
    document.addEventListener("click", function (e) {
      var b = e.target.closest(".ds-hubnav__btn[data-src]");
      if (!b) return;
      var src = b.getAttribute("data-src");
      if (viewer.getAttribute("src") !== src) { loader.classList.add("is-on"); viewer.setAttribute("src", src); }
      document.querySelectorAll(".ds-hubnav__btn").forEach(function (x) {
        x.classList.toggle("is-active", x.getAttribute("data-src") === src);
      });
      main.focus({ preventScroll: true });
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  })();
</script>
